<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Scrolling Shooter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }
        #instructions {
            color: #fff;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Vertical Scrolling Shooter</h1>
        <div id="game"></div>
        <div id="instructions">
            <p>Use ARROW KEYS or WASD to move | SPACE to shoot</p>
        </div>
    </div>
    <script src="/phaser/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
